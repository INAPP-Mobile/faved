<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>
  <!-- Bookmark shape -->
  <g transform="translate(64, 48)">
    <path d="M0,0 L96,0 L96,160 L48,112 L0,160 Z" fill="url(#accent)" rx="8"/>
    <!-- Bookmark hole/circle -->
    <circle cx="48" cy="56" r="14" fill="#1a1a2e"/>
    <circle cx="48" cy="56" r="10" fill="none" stroke="#e94560" stroke-width="2.5"/>
  </g>
  <!-- Small tag indicators -->
  <rect x="64" y="210" width="40" height="8" rx="4" fill="#e94560" opacity="0.7"/>
  <rect x="110" y="210" width="32" height="8" rx="4" fill="#f5a623" opacity="0.7"/>
</svg>